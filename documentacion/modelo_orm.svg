<g><rect x="60" y="165" width="330" height="260" rx="14" fill="white"/><path d="M74 165h302a14 14 0 0 1 14 14v38H60v-38a14 14 0 0 1 14-14" fill="#1d4ed8"/><text x="82" y="198" font-size="21" font-weight="700" fill="white">Jugadores · Player</text><text x="82" y="242" font-size="15" fill="#0f172a">🔑 id · PK</text><text x="82" y="268" font-size="15" fill="#334155">name · único</text><text x="82" y="294" font-size="15" fill="#334155">first_name, last_name</text><text x="82" y="320" font-size="15" fill="#334155">email · único</text><text x="82" y="346" font-size="15" fill="#334155">password, role, score</text><text x="82" y="372" font-size="15" fill="#334155">created_at</text><text x="82" y="405" font-size="13" fill="#64748b">Alumno o profesor · cuenta del juego</text></g>
<g><rect x="500" y="165" width="290" height="200" rx="14" fill="white"/><path d="M514 165h262a14 14 0 0 1 14 14v38H500v-38a14 14 0 0 1 14-14" fill="#7c3aed"/><text x="522" y="198" font-size="21" font-weight="700" fill="white">Banco de palabras · Word</text><text x="522" y="242" font-size="15" fill="#0f172a">🔑 id · PK</text><text x="522" y="268" font-size="15" fill="#334155">word · único, difficulty</text><text x="522" y="294" font-size="15" fill="#334155">theme, created_at</text><text x="522" y="320" font-size="15" fill="#334155">created_by_id · FK → Player</text><text x="522" y="350" font-size="13" fill="#64748b">Palabras para jugar · banco del profesor</text></g>
<g><rect x="900" y="165" width="350" height="200" rx="14" fill="white"/><path d="M914 165h322a14 14 0 0 1 14 14v38H900v-38a14 14 0 0 1 14-14" fill="#0891b2"/><text x="922" y="198" font-size="21" font-weight="700" fill="white">Partidas · Game</text><text x="922" y="242" font-size="15" fill="#0f172a">🔑 id · PK</text><text x="922" y="268" font-size="15" fill="#334155">player_id · FK → Player</text><text x="922" y="294" font-size="15" fill="#334155">word_id · FK → Word</text><text x="922" y="320" font-size="15" fill="#334155">assigned_game_id · FK opcional</text><text x="922" y="348" font-size="13" fill="#64748b">letras, intentos, estado y fechas</text></g>
<g><rect x="500" y="540" width="290" height="200" rx="14" fill="white"/><path d="M514 540h262a14 14 0 0 1 14 14v38H500v-38a14 14 0 0 1 14-14" fill="#ea580c"/><text x="522" y="573" font-size="21" font-weight="700" fill="white">Partidas temáticas · AssignedGame</text><text x="522" y="617" font-size="15" fill="#0f172a">🔑 id · PK</text><text x="522" y="643" font-size="15" fill="#334155">teacher_id, student_id · FK → Player</text><text x="522" y="669" font-size="15" fill="#334155">theme, difficulty, word_ids[]</text><text x="522" y="695" font-size="15" fill="#334155">current_index, status, created_at</text><text x="522" y="725" font-size="13" fill="#64748b">Asignada por profesor a uno o varios alumnos</text></g>
<g><rect x="900" y="540" width="350" height="180" rx="14" fill="white"/><path d="M914 540h322a14 14 0 0 1 14 14v38H900v-38a14 14 0 0 1 14-14" fill="#059669"/><text x="922" y="573" font-size="21" font-weight="700" fill="white">Palabra del Día · DailyWord</text><text x="922" y="617" font-size="15" fill="#0f172a">🔑 id · PK</text><text x="922" y="643" font-size="15" fill="#334155">word_id · FK → Word</text><text x="922" y="669" font-size="15" fill="#334155">set_by_id · FK → Player (opcional)</text><text x="922" y="697" font-size="13" fill="#64748b">set_date, active, created_at</text></g>
<g><rect x="900" y="790" width="350" height="170" rx="14" fill="white"/><path d="M914 790h322a14 14 0 0 1 14 14v38H900v-38a14 14 0 0 1 14-14" fill="#be123c"/><text x="922" y="823" font-size="20" font-weight="700" fill="white">Intentos de Palabra del Día · respuesta</text><text x="922" y="867" font-size="15" fill="#0f172a">🔑 id · PK</text><text x="922" y="893" font-size="15" fill="#334155">daily_word_id, player_id · FK</text><text x="922" y="919" font-size="15" fill="#334155">answer_letter, response_time_ms</text><text x="922" y="945" font-size="13" fill="#64748b">points_earned, is_correct · par único (daily_word, player)</text></g>
</g>
<text x="65" y="520" font-family="Arial,sans-serif" font-size="14" fill="#64748b">PK = identificador · FK = relación con otro dato · → indica a quién pertenece</text><text x="65" y="550" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Los nombres técnicos entre paréntesis corresponden a los modelos Django del proyecto.</text>
</svg>
