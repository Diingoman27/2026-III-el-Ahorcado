<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Recuperar contraseña - Ahorcado UTVAM</title>
  <link rel="stylesheet" href="/static/styles.css?v=20261016-password-recovery" />
</head>
<body>
  <div class="particle-field" id="particle-field" aria-hidden="true"></div>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="topbar glass">
    <a class="brand" href="/" aria-label="Ahorcado UTVAM, inicio">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>Ahorcado <strong>UTVAM</strong></span>
    </a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema" aria-pressed="false">
      <span class="theme-icon">☀︎</span><span class="theme-icon">☾</span><span class="theme-thumb" aria-hidden="true"></span>
    </button>
  </header>
  <main class="app recovery-app">
    <section class="panel" aria-labelledby="recovery-title">
      <span class="eyebrow">Ayuda con tu cuenta</span>
      <h1 id="recovery-title">Recuperar contraseña</h1>
      <p id="recovery-description">Escribe el correo asociado a tu cuenta y te enviaremos un enlace para elegir una contraseña nueva.</p>

      <form id="request-reset-form" class="auth-form" novalidate>
        <label for="recovery-email">Correo electrónico:</label>
        <input
          type="email"
          id="recovery-email"
          maxlength="100"
          autocomplete="email"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
          required
        />
        <button type="submit">Enviar enlace de recuperación</button>
      </form>

      <form id="reset-password-form" class="auth-form hidden" novalidate>
        <label for="new-password">Nueva contraseña:</label>
        <input
          type="password"
          id="new-password"
          minlength="12"
          maxlength="72"
          autocomplete="new-password"
          aria-describedby="password-requirements"
          required
        />
        <small class="email-hint" id="password-requirements">Entre 12 y 72 caracteres, con mayúsculas, minúsculas y números.</small>
        <label for="confirm-password">Confirma la nueva contraseña:</label>
        <input type="password" id="confirm-password" minlength="12" maxlength="72" autocomplete="new-password" required />
        <button type="submit">Cambiar contraseña</button>
      </form>

      <div class="message" id="recovery-message" aria-live="polite"></div>
      <a class="password-recovery-link" id="recovery-login-link" href="/">Volver al inicio de sesión</a>
    </section>
  </main>
  <script src="/static/components/theme.js"></script>
  <script type="module" src="/static/components/password-recovery.mjs?v=20261016"></script>
</body>
</html>
